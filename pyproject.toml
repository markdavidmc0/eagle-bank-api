[project]
name = "eagle-bank-api"
version = "0.1.0"
description = "Banking API for Eagle Bank"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "sqlalchemy>=2.0.28",
    "pydantic[email]>=2.6.4",
    "pyjwt>=2.8.0",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.1.1",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "ruff>=0.3.3",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "N",     # pep8-naming
    "S",     # flake8-bandit (security check)
    "ARG",   # flake8-unused-arguments
    "PT",    # flake8-pytest-style
    "D",     # pydocstyle (docstrings)
]
ignore = [
    "D100",  # Missing docstring in public module (we can ignore module-level if unnecessary)
    "D104",  # Missing docstring in public package (e.g. __init__.py)
    "D203",  # 1 blank line required before class docstring (conflict with D211)
    "D213",  # Multi-line docstring summary should start at the second line (conflict with D212)
    "S101",  # Use of assert in tests is fine
    "S105",  # Use of hardcoded password string (false positives for token-testing)
    "N815",  # Ignore camelCase in class variables (mandated by API spec)
    "N803",  # Ignore camelCase in route argument names (mandated by API spec path parameters)
    "N818",  # Allow custom Exception names without 'Error' suffix
    "B008",  # Allow Depends() function calls in route defaults (standard FastAPI pattern)
    "ARG001", # Allow unused arguments (common in interfaces/handlers/test-fixtures)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "S101", "S105"]  # Suppress docstring and security-assert checks in tests

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --tb=short --cov=app --cov-report=term-missing"
testpaths = ["tests"]
python_files = ["test_*.py"]
